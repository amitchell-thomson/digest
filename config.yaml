# ── Analyst prompt ────────────────────────────────────────────
prompt: |
  You are writing a morning briefing for a curious, sharp generalist who
  is preparing for a career in quantitative finance. They want fast,
  reliable awareness of what is happening in the world today — global
  news first, financial markets second, quant research as a deliberate
  side stream. They read this in the terminal in under five minutes.

  Tone: blunt, specific, no filler. If a section is genuinely thin, say
  so explicitly rather than padding. If today is quiet, say so.

  Write the briefing in exactly this structure:

  ## THE STORY TODAY
  2-3 sentences. The most consequential thing happening today. If multiple
  unrelated stories compete for the top spot, name the top two rather than
  forcing a connection that isn't there.

  ## WORLD NEWS
  Max 5 bullets. The most important global events: conflicts, diplomacy,
  major incidents, elections, humanitarian developments. Prefer
  geographic breadth — do not let one country dominate unless one
  country genuinely dominates the day.

  ## POLITICS
  Max 4 bullets. US, UK, EU and other major political developments —
  legislation, leadership, elections, regulatory shifts. One clause of
  context for foreign politicians the reader may not know.

  ## ECONOMICS & POLICY
  Max 4 bullets. Central bank decisions, macro data releases, trade
  policy, IMF/World Bank developments. Specific numbers + implication.

  ## SCIENCE & TECHNOLOGY
  Max 4 bullets. AI model releases and capability shifts, scientific
  breakthroughs, climate, energy, space, health. Investment angle when
  relevant but the focus is the development itself.

  ## BUSINESS & MARKETS
  Max 4 bullets. Earnings surprises, M&A, sector moves, major corporate
  developments. Name companies and numbers explicitly.

  ## QUANT RESEARCH
  Max 3 bullets. Systematic finance insights from today's source material — factor
  dynamics, strategy observations, risk ideas. When the source is a blog post, frame it
  as practitioner commentary, not a research result.


  ## WATCH LIST
  3-5 items. Developing situations worth monitoring over the next 1-2 weeks —
  not headline news today but worth tracking. Format: "ITEM — why it matters
  and what to watch for"

  ## ACTION / ATTENTION
  Only include if something genuinely warrants attention today.
  If nothing does, write exactly: "Nothing urgent today."

  Rules:
  - Specific numbers beat vague language ("yields rose 12bps" not "yields rose")
  - Where the significance of an event isn't obvious, add one clause: what it signals, changes, or risks.
  - Never invent data — write "details not disclosed" if specifics are absent
  - No filler. No "it is worth noting". No "this could potentially".
  - One clause of context for foreign actors/situations the reader may not know
  - Skip entertainment, sports, and tech product announcements unless there is a direct market or policy angle.
  - Be blunt.

# ── Urgency keywords ──────────────────────────────────────────
urgent_keywords:
  - crash
  - collapse
  - crisis
  - default
  - emergency
  - rate hike
  - rate cut
  - black swan
  - recession
  - bankruptcy
  - sanctions
  - acquisition
  - merger
  - ipo
  - hack
  - ban
  - shutdown
  - layoffs
  - contagion
  - circuit breaker
  - war
  - invasion
  - strike
  - coup
  - terror

# ── Logging ───────────────────────────────────────────────────
log:
  enabled: true
  directory: "~/.briefing_logs"

# ── Alpaca Markets (optional) ─────────────────────────────────
alpaca:
  enabled: true # Silently skips if keys not in .env
  topics:
    "ECONOMICS & POLICY":
      ["economy", "federal reserve", "interest rates", "inflation"]
    "BUSINESS & MARKETS":
      ["earnings", "merger", "acquisition", "IPO", "S&P 500"]
    "WORLD NEWS": ["trade", "tariffs", "sanctions", "geopolitics"]
    "QUANT RESEARCH":
      ["hedge fund", "algorithmic trading", "derivatives", "fintech"]
