# ─────────────────────────────────────────────────────────────
# briefing / config.yaml
# All user-tunable settings. Edit freely.
# ─────────────────────────────────────────────────────────────

# ── Articles ──────────────────────────────────────────────────
articles_per_section: 6
max_description_chars: 1500
max_article_age_days: 3 # skip articles older than this; 3 catches Mon-Wed articles on Friday

# ── Claude ────────────────────────────────────────────────────
claude:
  model: "claude-sonnet-4-6"
  max_tokens: 4000

# ── Market data ───────────────────────────────────────────────
market_tickers:
  "S&P 500": "^GSPC"
  "NASDAQ": "^IXIC"
  "FTSE 100": "^FTSE"
  "DAX": "^GDAXI"
  "GBP/USD": "GBPUSD=X"
  "EUR/USD": "EURUSD=X"
  "BTC": "BTC-USD"
  "Gold": "GC=F"
  "Oil (WTI)": "CL=F"
  "US 10Y": "^TNX"

