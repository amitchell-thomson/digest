[tool.uv]
package = true

[tool.setuptools]
py-modules = ["briefing", "analyse", "fetch", "render", "store", "tui"]

[project]
name = "digest"
version = "0.1.0"
description = "Daily global news briefing for the terminal. Claude-written, RSS-sourced, searchable."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.97.0",
    "click>=8.3.3",
    "dotenv>=0.9.9",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.5",
    "trafilatura>=1.6.0",
    "yfinance>=1.3.0",
]

[project.scripts]
digest = "briefing:cli"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
